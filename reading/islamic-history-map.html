<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中斷的天命：疆界變遷地圖</title>
<style>
  :root{
    --ink:#1b2430; --ink-2:#26313f;
    --parchment:#ece2c6; --parchment-dim:#cdbf99;
    --sea:#8ba4b0;
    --gold:#c19a49; --gold-dim:#8a723a;
    --text-light:#f2ead6; --text-muted:#b9ac8a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text-light);
    font-family:'Noto Serif TC','Songti TC',Georgia,serif;}
  .app{max-width:1000px;margin:0 auto;padding:18px 14px 28px;}
  header{text-align:center;margin-bottom:14px;}
  header h1{font-size:1.5rem;letter-spacing:.04em;margin:0 0 4px;color:var(--gold);font-weight:700;}
  header p.sub{margin:0;font-size:.82rem;color:var(--text-muted);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;}
  .frame{position:relative;border:1px solid var(--gold-dim);border-radius:6px;
    background:var(--ink-2);padding:10px;}
  .corner{position:absolute;width:26px;height:26px;opacity:.85;}
  .corner.tl{top:6px;left:6px;} .corner.tr{top:6px;right:6px;transform:scaleX(-1);}
  .corner.bl{bottom:6px;left:6px;transform:scaleY(-1);} .corner.br{bottom:6px;right:6px;transform:scale(-1,-1);}
  #map{width:100%;height:auto;display:block;border-radius:3px;overflow:hidden;}
  .land{fill:var(--parchment);stroke:none;}
  .sea-bg{fill:var(--sea);}
  .city-dot{fill:#3a2f22;}
  .city-label{fill:#3a2f22;font-size:8.5px;font-family:-apple-system,sans-serif;
    paint-order:stroke;stroke:var(--parchment);stroke-width:2.2px;stroke-linejoin:round;}
  .territory{stroke-width:1.4;fill-opacity:.75;stroke-opacity:1;transition:opacity .35s ease;}
  .legend{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
  .legend-item{display:flex;align-items:center;gap:6px;color:var(--text-light);}
  .swatch{width:11px;height:11px;border-radius:2px;flex:none;}
  .era-info{margin-top:14px;padding:12px 14px;background:var(--ink-2);
    border:1px solid var(--gold-dim);border-radius:6px;}
  .era-year{color:var(--gold);font-size:1.1rem;font-weight:700;letter-spacing:.03em;}
  .era-badge{display:inline-block;margin-left:8px;font-size:.65rem;padding:1px 7px;
    border-radius:10px;vertical-align:middle;font-family:-apple-system,sans-serif;}
  .era-badge.real{background:#2f6f5e33;color:#8fd6b8;border:1px solid #2f6f5e88;}
  .era-badge.hand{background:#8a6d3b33;color:#e0c48f;border:1px solid #8a6d3b88;}
  .era-title{font-size:1rem;margin:2px 0 6px;}
  .era-desc{font-size:.85rem;line-height:1.65;color:var(--text-muted);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;margin:0;}
  .timeline{margin-top:0;display:flex;align-items:center;gap:10px;}
  .tbtn{background:var(--ink-2);border:1px solid var(--gold-dim);color:var(--gold);
    width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .tbtn:active{background:var(--gold-dim);} .tbtn:disabled{opacity:.3;cursor:default;}
  #slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
    background:var(--gold-dim);outline:none;}
  #slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--gold);border:2px solid var(--ink);cursor:pointer;}
  #slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold);
    border:2px solid var(--ink);cursor:pointer;}
  .ticks{display:flex;justify-content:space-between;margin-top:4px;padding:0 2px;}
  .ticks span{font-size:.6rem;color:var(--text-muted);font-family:-apple-system,sans-serif;}
  .note{margin-top:12px;font-size:.7rem;color:var(--text-muted);line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
  .loose-fill{fill:url(#looseHatch);stroke:#8a723a;stroke-width:1;stroke-dasharray:3,2;fill-opacity:.55;}
  .battle-dot{fill:#e6d9b8;stroke:#7a1f1f;stroke-width:1.2;}
  .battle-glyph{font-size:9px;fill:#7a1f1f;text-anchor:middle;dominant-baseline:central;
    font-family:-apple-system,sans-serif;pointer-events:none;}
  .battles-section{margin-top:10px;padding-top:8px;border-top:1px dashed var(--gold-dim);}
  .battles-title{font-size:.72rem;color:var(--gold);margin-bottom:4px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
  .battle-item{font-size:.78rem;line-height:1.55;color:var(--text-muted);margin-bottom:4px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;}
  .battle-item b{color:var(--text-light);font-weight:600;}
  .battle-item .by{color:#d9a5a5;font-size:.7rem;}
  .mini-tl{position:relative;height:26px;margin-top:8px;}
  .mini-tl-line{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--gold-dim);}
  .mini-tl-dot{position:absolute;top:6px;width:9px;height:9px;border-radius:50%;
    background:#7a1f1f;border:1.5px solid #e6d9b8;cursor:pointer;transform:translateX(-50%);}
  .mini-tl-dot:hover{background:#a3272f;}
  .legend-item.loose .swatch{background:repeating-linear-gradient(45deg,#8a723a,#8a723a 2px,#00000000 2px,#00000000 5px);
    border:1px dashed #8a723a;}
  .legend-ethnic{margin-top:8px;padding-top:8px;border-top:1px dashed var(--gold-dim);
    display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
  .legend-ethnic-title{width:100%;font-size:.7rem;color:var(--gold);margin-bottom:2px;}
  .ethnic-swatch{width:16px;height:0;border-top:3px solid;display:inline-block;flex:none;}
  .ethnic-summary{margin-top:4px;font-size:.78rem;color:#d9c88f;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
  .neighbor{stroke-width:1.6;stroke-dasharray:5,3;fill-opacity:.32;stroke-opacity:.85;
    transition:opacity .35s ease;}
  .legend-neighbor{margin-top:8px;padding-top:8px;border-top:1px dashed var(--gold-dim);
    display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
  .legend-neighbor-title{width:100%;font-size:.7rem;color:var(--gold);margin-bottom:2px;}
  .neighbor-swatch{width:12px;height:12px;border-radius:2px;flex:none;opacity:.75;
    border:1.5px dashed;background-clip:padding-box;}
  .sect-tag{color:var(--text-muted);font-size:.72rem;}
  .sticky-timeline{position:sticky;top:0;z-index:20;background:var(--ink);
    padding:8px 0 6px;margin:0 -14px 14px;padding-left:14px;padding-right:14px;
    border-bottom:1px solid var(--gold-dim);box-shadow:0 4px 10px -4px rgba(0,0,0,.5);}
  .sticky-era-label{margin-top:4px;font-size:.72rem;color:var(--text-muted);text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
  .sticky-era-label b{color:var(--gold);font-weight:700;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>疆界變遷：伊斯蘭世界的天命之路</h1>
    <p class="sub">配合《中斷的天命》閱讀的地圖 · 海岸線／城市座標／多數時代疆界取自真實地理資料</p>
  </header>

  <div class="sticky-timeline">
    <div class="timeline">

    <div class="ticks" id="ticks"></div>

  <div class="frame">

      <defs>

          <line x1="0" y1="0" x2="0" y2="6" stroke="#8a723a" stroke-width="1.4"/>
        </pattern>
      </defs>
      <rect class="sea-bg" x="0" y="0" width="860" height="470"/>
      <path id="landPath" class="land" d=""/>
      <path id="looseControlPath" class="loose-fill" d="" style="display:none"/>
      <g id="neighbors"></g>
      <g id="territories"></g>
      <g id="cities"></g>
      <g id="battles"></g>
    </svg>

    <div class="legend" id="legend"></div>
    <div class="legend-neighbor" id="legendNeighbor"></div>
    <div class="legend-ethnic" id="legendEthnic"></div>
  </div>

  <div class="era-info">
    <span class="era-year" id="eraYear"></span><span class="era-badge" id="eraBadge"></span>
    <div class="era-title" id="eraTitle"></div>
    <p class="era-desc" id="eraDesc"></p>
    <p class="ethnic-summary" id="ethnicSummary"></p>
    <div class="battles-section" id="battlesSection" style="display:none">
      <div class="battles-title">⚔ 促成此局面的關鍵戰役</div>
      <div id="battlesList"></div>

  </div>

  <div class="mini-tl" id="miniTl">
    <div class="mini-tl-line"></div>
  </div>

  <p class="note" id="sourceNote"></p>
</div>

<script>
// ---- render base coastline once ----
document.getElementById('landPath').setAttribute('d', MAP_DATA.coastline);

const cityG = document.getElementById('cities');
MAP_DATA.cities.forEach(c=>{
  const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('cx',c.x); dot.setAttribute('cy',c.y); dot.setAttribute('r',2.2);
  dot.setAttribute('class','city-dot');
  cityG.appendChild(dot);
  const label = document.createElementNS('http://www.w3.org/2000/svg','text');
  label.setAttribute('x',c.x+3.5); label.setAttribute('y',c.y+3);
  label.setAttribute('class','city-label');
  label.textContent = c.n;
  cityG.appendChild(label);
});

// ---- ticks ----
const ticksEl = document.getElementById('ticks');
MAP_DATA.epochs.forEach(e=>{
  const span = document.createElement('span');
  span.textContent = e.year.replace('約 ','').replace(' 年','').replace('現代（約 ','~').replace('）','');
  ticksEl.appendChild(span);
});

const territoryG = document.getElementById('territories');
const neighborsG = document.getElementById('neighbors');
const battlesG = document.getElementById('battles');
const looseControlPath = document.getElementById('looseControlPath');
const legendEl = document.getElementById('legend');
const legendNeighborEl = document.getElementById('legendNeighbor');
const legendEthnicEl = document.getElementById('legendEthnic');
const yearEl = document.getElementById('eraYear');
const badgeEl = document.getElementById('eraBadge');
const titleEl = document.getElementById('eraTitle');
const descEl = document.getElementById('eraDesc');
const ethnicSummaryEl = document.getElementById('ethnicSummary');
const battlesSection = document.getElementById('battlesSection');
const battlesList = document.getElementById('battlesList');
const noteEl = document.getElementById('sourceNote');
const stickyEraLabel = document.getElementById('stickyEraLabel');
const slider = document.getElementById('slider');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderEra(idx){
  const era = MAP_DATA.epochs[idx];
  territoryG.innerHTML = '';
  neighborsG.innerHTML = '';
  battlesG.innerHTML = '';
  legendEl.innerHTML = '';
  legendNeighborEl.innerHTML = '';
  legendEthnicEl.innerHTML = '';

  // non-Islamic neighboring powers, drawn under the main territories, dashed/translucent
  (era.neighbors||[]).forEach(n=>{
    const el = document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('d', n.d);
    el.setAttribute('fill', n.color);
    el.setAttribute('stroke', n.color);
    el.setAttribute('class','neighbor');
    neighborsG.appendChild(el);
  });
  if(era.neighbors && era.neighbors.length){
    const title = document.createElement('div');
    title.className = 'legend-neighbor-title';
    title.textContent = '鄰近非伊斯蘭政權（虛線邊框）';
    legendNeighborEl.appendChild(title);
    era.neighbors.forEach(n=>{
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="neighbor-swatch" style="background:${n.color};border-color:${n.color}"></span>${n.name}`;
      legendNeighborEl.appendChild(item);
    });
  }

  // loose-control (tribal / nominal suzerainty) overlay, drawn under territory fills
  if(era.looseControl){
    looseControlPath.setAttribute('d', era.looseControl);
    looseControlPath.style.display = '';
  } else {
    looseControlPath.style.display = 'none';
  }

  const seenEthnic = new Map();
  era.polys.forEach(t=>{
    const el = document.createElementNS('http://www.w3.org/2000/svg', t.d ? 'path' : 'polygon');
    if(t.d){ el.setAttribute('d', t.d); } else { el.setAttribute('points', t.points); }
    el.setAttribute('fill', t.color);
    el.setAttribute('stroke', t.ethnicityColor || t.color);
    el.setAttribute('class','territory');
    el.style.opacity = 0;
    territoryG.appendChild(el);
    requestAnimationFrame(()=>{ el.style.opacity = 1; });

    const item = document.createElement('div');
    item.className = 'legend-item';
    const sectHtml = t.sectZh ? ` <span class="sect-tag">（${t.sectZh}）</span>` : '';
    item.innerHTML = `<span class="swatch" style="background:${t.color}"></span>${t.name}${sectHtml}`;
    legendEl.appendChild(item);

    if(t.ethnicity && !seenEthnic.has(t.ethnicity)){
      seenEthnic.set(t.ethnicity, {color: t.ethnicityColor, zh: t.ethnicityZh});
    }
  });

  if(era.looseControl){
    const item = document.createElement('div');
    item.className = 'legend-item loose';
    item.innerHTML = `<span class="swatch"></span>游牧部落自治／鬆散宗主權（非直接統治）`;
    legendEl.appendChild(item);
  }

  if(seenEthnic.size){
    const title = document.createElement('div');
    title.className = 'legend-ethnic-title';
    title.textContent = '邊框顏色＝統治族裔';
    legendEthnicEl.appendChild(title);
    seenEthnic.forEach(({color,zh})=>{
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="ethnic-swatch" style="border-color:${color}"></span>${zh}`;
      legendEthnicEl.appendChild(item);
    });
  }

  // battle markers on map
  (era.battles||[]).forEach(b=>{
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',b.x); dot.setAttribute('cy',b.y); dot.setAttribute('r',6);
    dot.setAttribute('class','battle-dot');
    battlesG.appendChild(dot);
    const glyph = document.createElementNS('http://www.w3.org/2000/svg','text');
    glyph.setAttribute('x',b.x); glyph.setAttribute('y',b.y+0.5);
    glyph.setAttribute('class','battle-glyph');
    glyph.textContent = '\u2694';
    battlesG.appendChild(glyph);
  });

  // battles list in info panel
  if(era.battles && era.battles.length){
    battlesSection.style.display = '';
    battlesList.innerHTML = '';
    era.battles.forEach(b=>{
      const div = document.createElement('div');
      div.className = 'battle-item';
      div.innerHTML = `<b>${b.name}</b> <span class="by">${b.year} 年</span><br>${b.blurb}`;
      battlesList.appendChild(div);
    });
  } else {
    battlesSection.style.display = 'none';
  }

  yearEl.textContent = era.year;
  badgeEl.textContent = era.real ? '真實地理資料' : '手繪示意';
  badgeEl.className = 'era-badge ' + (era.real ? 'real' : 'hand');
  titleEl.textContent = era.title;
  descEl.textContent = era.desc;
  ethnicSummaryEl.textContent = era.ethnicitySummary ? ('族裔構成：' + era.ethnicitySummary) : '';
  stickyEraLabel.innerHTML = `<b>${era.year}</b> ${era.title}`;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === MAP_DATA.epochs.length-1;

  document.querySelectorAll('.mini-tl-dot').forEach(d=>{
    d.style.background = (parseInt(d.dataset.after,10) === idx) ? '#a3272f' : '#7a1f1f';
  });
}

// ---- mini battle timeline (proportional by year, spans full range) ----
const miniTl = document.getElementById('miniTl');
const [rangeStart, rangeEnd] = MAP_DATA.timelineRange;
(MAP_DATA.allBattles||[]).forEach(b=>{
  const pct = (b.year - rangeStart) / (rangeEnd - rangeStart) * 100;
  const dot = document.createElement('div');
  dot.className = 'mini-tl-dot';
  dot.style.left = pct + '%';
  dot.dataset.after = b.after;
  dot.title = `${b.year} 年 ${b.name}`;
  dot.addEventListener('click', ()=>{
    slider.value = b.after;
    renderEra(b.after);
  });
  miniTl.appendChild(dot);
});

slider.max = MAP_DATA.epochs.length - 1;
slider.addEventListener('input', e=> renderEra(parseInt(e.target.value,10)));
prevBtn.addEventListener('click', ()=>{
  slider.value = Math.max(0, parseInt(slider.value,10)-1);
  renderEra(parseInt(slider.value,10));
});
nextBtn.addEventListener('click', ()=>{
  slider.value = Math.min(MAP_DATA.epochs.length-1, parseInt(slider.value,10)+1);
  renderEra(parseInt(slider.value,10));
});

noteEl.textContent = "說明：海岸線、國界（現代部分）與城市座標取自公開歷史地理資料集（aourednik/historical-basemaps，該專案綜合多方史料繪製）與 Google 地圖真實座標；多數時代（700～2010年）的政權疆域直接取自該資料集的對應年份快照並簡化去除細碎小島以利渲染。西元 622／632 年因政治體過小、無對應資料集年份，改以真實城市座標手繪示意（圖中已標示「手繪示意」）。所有歷史疆界本質上是學術估計值而非精確測量，僅供理解相對範圍與趨勢之用。";

renderEra(0);
</script>
