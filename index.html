<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Tse</title>
    <style>
        :root {
            --g: #1D9E75;
            --gl: #E1F5EE;
            --p: #17817A;
            --pl: #E1F0EF;
            --o: #BA7517;
            --ol: #FEF3E2;
            --b: #1E7FD8;
            --bl: #E6F1FB;
            --r: #C0392B;
            --bg: #F4F8F8;
            --card: #fff;
            --bdr: #DCE7E6;
            --tx: #182524;
            --sub: #5C6E6C;
            --rd: 12px;
            --rs: 8px;
            --coffee: #6B3A2A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--tx);
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.55;
        }

        .w {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        /* ── Page header ── */
        .page-header {
            margin-bottom: 32px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .hero-sub {
            color: var(--sub);
            font-size: 13px;
        }

        /* ── Category label ── */
        .cat-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--sub);
            margin-bottom: 10px;
            padding-left: 2px;
        }

        /* ── Cards grid ── */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }


        /* ── Travel card ── */
        .travel-card {
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: var(--rd);
            overflow: hidden;
            transition: box-shadow .2s, border-color .2s;
            cursor: pointer;
        }

        .travel-card:hover {
            border-color: var(--p);
            box-shadow: 0 4px 18px rgba(23,129,122,.12);
        }

        .card-header {
            background: linear-gradient(135deg, var(--p) 0%, #14506B 100%);
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            border: none;
            font-family: inherit;
            width: 100%;
            text-align: left;
            user-select: none;
        }

        .card-header:hover { background: linear-gradient(135deg,#106059 0%,#0D3A4D 100%); }

        /* coffee variant */
        .travel-card.coffee-card { }
        .travel-card.coffee-card:hover {
            border-color: var(--coffee);
            box-shadow: 0 4px 18px rgba(107,58,42,.12);
        }
        .coffee-card .card-header {
            background: linear-gradient(135deg, var(--coffee) 0%, #3E1F0D 100%);
        }
        .coffee-card .card-header:hover { background: linear-gradient(135deg,#552E21 0%,#2E1508 100%); }

        .card-title-section { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-date { font-size: 12px; opacity: .9; }

        .card-description {
            font-size: 12px;
            opacity: .82;
            line-height: 1.45;
        }

        .toggle-icon {
            font-size: 18px;
            flex-shrink: 0;
            transition: transform .3s;
            margin-top: 2px;
        }

        .travel-card.expanded .toggle-icon { transform: rotate(180deg); }

        .card-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease;
            background: var(--bg);
        }

        .travel-card.expanded .card-content {
            max-height: none;
            max-height: 90vh;
            padding: 20px;
            overflow-y: auto;
        }

        iframe {
            width: 100%;
            border: none;
            min-height: 1200px;
            height: auto;
            border-radius: var(--rs);
            background: white;
        }

        /* ── Archived trips (past date or suspended) ── */
        .travel-card.archived .card-header {
            padding: 10px 16px;
            gap: 8px;
        }
        .travel-card.archived .card-title { font-size: 13px; gap: 6px; }
        .travel-card.archived .card-date { font-size: 11px; }
        .travel-card.archived .card-description { display: none; }
        .travel-card.archived .toggle-icon { font-size: 15px; }
        .travel-card.archived .card-header {
            opacity: .72;
            filter: grayscale(45%);
        }

        .archive-group {
            border: 1px solid var(--bdr);
            border-radius: var(--rd);
            overflow: hidden;
            background: var(--card);
            margin-bottom: 32px;
        }

        .archive-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            background: var(--bg);
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            color: var(--sub);
            text-align: left;
            user-select: none;
        }
        .archive-toggle:hover { color: var(--tx); }

        .archive-count { color: var(--sub); font-weight: 400; }

        .archive-toggle .toggle-icon {
            margin-left: auto;
            font-size: 14px;
            transition: transform .3s;
        }
        .archive-group.expanded .archive-toggle .toggle-icon { transform: rotate(90deg); }

        .archive-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease;
        }
        .archive-group.expanded .archive-content {
            max-height: 4000px;
        }
        .archive-content .travel-card {
            border: none;
            border-radius: 0;
            border-top: 1px solid var(--bdr);
        }
        .archive-content .travel-card:hover { box-shadow: none; }

        /* ── Section dividers ── */
        .section-sep {
            border: none;
            border-top: 1px solid var(--bdr);
            margin: 4px 0 28px;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            margin-top: 20px;
            color: var(--sub);
            font-size: 12px;
            padding-top: 20px;
            border-top: 1px solid var(--bdr);
        }

        /* ── Mobile tweaks ── */
        @media (max-width: 640px) {
            .w { padding: 16px 12px 40px; }
            h1 { font-size: 19px; }
            .card-header { padding: 14px 16px; }
            .card-title { font-size: 15px; }
            .travel-card.expanded .card-content { max-height: 90vh; padding: 14px; }
            iframe { min-height: 800px; }
        }
    </style>
</head>
<body>
    <div class="w">
        <div class="page-header">
            <h1>Tse</h1>
            <p class="hero-sub">Personal notes — travel plans, coffee recipes &amp; more</p>
        </div>

        <!-- ── TRAVEL PLANS ── -->
        <p class="cat-label">✈️ Travel Plans</p>
        <hr class="section-sep">
        <div class="cards-grid" id="travel-cards-grid">

            <div class="travel-card" data-trip="jinguashi" data-end="2026-06-30">
                <button class="card-header" type="button" aria-expanded="false">
                    <div class="card-title-section">
                        <div class="card-title">⛏️ 金瓜石山城小旅行</div>
                        <div class="card-date">June 29–30, 2026 · 自駕兩天一夜</div>
                        <div class="card-description">北投行義路出發，野柳地質公園、黃金博物館、無耳茶壺山、九份夜景。</div>
                    </div>
                    <div class="toggle-icon" aria-hidden="true">▼</div>
                </button>
                <div class="card-content">
                    <iframe src="travel/jinguashi_2d1n_jun29.html" title="金瓜石兩天一夜" loading="lazy"></iframe>
                </div>
            </div>

            <div class="travel-card" data-trip="canada" data-end="2026-10-12" data-status="suspended">
                <button class="card-header" type="button" aria-expanded="false">
                    <div class="card-title-section">
                        <div class="card-title">🍁 Canada Trip — 6 People <span style="display:inline-block; background:#F3E5E5; color:#8B2F2F; font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; margin-left:8px; letter-spacing:.05em;">⏸ 暫不執行</span></div>
                        <div class="card-date">October 1–12, 2026</div>
                        <div class="card-description">Day-by-day plans, accommodation & activities across multiple cities.</div>
                    </div>
                    <div class="toggle-icon" aria-hidden="true">▼</div>
                </button>
                <div class="card-content">
                    <iframe src="travel/canada_6pax_oct1_12.html" title="Canada Trip Itinerary" loading="lazy"></iframe>
                </div>
            </div>

            <div class="travel-card" data-trip="hokuriku" data-end="2026-11-29">
                <button class="card-header" type="button" aria-expanded="false">
                    <div class="card-title-section">
                        <div class="card-title">🏯 Hokuriku Trip 2026</div>
                        <div class="card-date">November 21–29, 2026</div>
                        <div class="card-description">Local attractions, cultural sites &amp; dining in the Hokuriku region.</div>
                    </div>
                    <div class="toggle-icon" aria-hidden="true">▼</div>
                </button>
                <div class="card-content">
                    <iframe src="travel/hokuriku_trip_2026.html?v=2" title="Hokuriku Trip Itinerary" loading="lazy"></iframe>
                </div>
            </div>

        </div>

        <div class="archive-group" id="travel-archive-group" hidden>
            <button class="archive-toggle" type="button" aria-expanded="false">
                <span>📦 過去 / 暫停的行程</span>
                <span class="archive-count" id="travel-archive-count"></span>
                <span class="toggle-icon" aria-hidden="true">▸</span>
            </button>
            <div class="archive-content" id="travel-archive-content"></div>
        </div>

        <!-- ── COFFEE ── -->
        <p class="cat-label">☕ Coffee</p>
        <hr class="section-sep">
        <div class="cards-grid">

            <div class="travel-card coffee-card" data-trip="neo-brew">
                <button class="card-header" type="button" aria-expanded="false">
                    <div class="card-title-section">
                        <div class="card-title">🏆 粕谷哲 NEO BREW 十次沖煮法</div>
                        <div class="card-date">2016 世界手沖大賽冠軍 · 2026 年度配方</div>
                        <div class="card-description">超粗研磨 × 長時間萃取 · 10 次注水 · Comandante 40–45 Clicks · 95–96 °C</div>
                    </div>
                    <div class="toggle-icon" aria-hidden="true">▼</div>
                </button>
                <div class="card-content">
                    <iframe src="coffee/tetsu_kasuya_neo_brew.html" title="Tetsu Kasuya NEO BREW Recipe" loading="lazy"></iframe>
                </div>
            </div>

        </div>

        <div class="footer">
            <p>Built with care · Updated 2026</p>
        </div>
    </div>

    <script>
        const cards = document.querySelectorAll('.travel-card');

        cards.forEach(card => {
            const header = card.querySelector('.card-header');

            header.addEventListener('click', (e) => {
                e.stopPropagation();
                const isExpanded = card.classList.contains('expanded');

                cards.forEach(c => {
                    c.classList.remove('expanded');
                    c.querySelector('.card-header').setAttribute('aria-expanded', 'false');
                });

                if (!isExpanded) {
                    card.classList.add('expanded');
                    header.setAttribute('aria-expanded', 'true');
                    if (window.innerWidth <= 640) {
                        setTimeout(() => header.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
                    }
                }
            });

            header.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    header.click();
                }
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.travel-card')) {
                cards.forEach(c => {
                    c.classList.remove('expanded');
                    c.querySelector('.card-header').setAttribute('aria-expanded', 'false');
                });
            }
        });

        // ── Fold past-dated / suspended trips into the archive group ──
        (function initArchiving() {
            const grid = document.getElementById('travel-cards-grid');
            const archiveGroup = document.getElementById('travel-archive-group');
            const archiveContent = document.getElementById('travel-archive-content');
            const archiveCount = document.getElementById('travel-archive-count');
            if (!grid || !archiveGroup) return;

            const today = new Date();
            const tripCards = Array.from(grid.querySelectorAll('.travel-card'));
            let archivedTotal = 0;

            tripCards.forEach(card => {
                const end = card.dataset.end;
                const isPast = !!end && new Date(end + 'T23:59:59') < today;
                const isSuspended = card.dataset.status === 'suspended';
                if (isPast || isSuspended) {
                    card.classList.add('archived');
                    archiveContent.appendChild(card);
                    archivedTotal++;
                }
            });

            if (archivedTotal > 0) {
                archiveGroup.hidden = false;
                archiveCount.textContent = `(${archivedTotal})`;

                const toggle = archiveGroup.querySelector('.archive-toggle');
                toggle.addEventListener('click', () => {
                    const expanded = archiveGroup.classList.toggle('expanded');
                    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                });
            }
        })();
    </script>
</body>
</html>
